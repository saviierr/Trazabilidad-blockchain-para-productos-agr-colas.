# WP-20 · Red Hyperledger Fabric — 1 orderer (Raft de un solo nodo) + 3 peers
# (organizaciones validadoras: Cooperativa, Certificadora, Exportador — §2.1/§2.2
# de docs/WP-20-plan-red-hyperledger-fabric.md). Transportista no aloja peer.
name: cacao-fabric-net

networks:
  cacao-fabric:
    external: true

volumes:
  orderer.cacao.local:
  peer0.cooperativa.cacao.local:
  peer0.certificadora.cacao.local:
  peer0.exportador.cacao.local:

services:
  orderer.cacao.local:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.cacao.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      # Sin canal de sistema — se une al canal vía Channel Participation API (osnadmin).
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED=true
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
    working_dir: /root
    command: orderer
    volumes:
      - ../organizations/ordererOrganizations/orderer.cacao.local/orderers/orderer.orderer.cacao.local/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/orderer.cacao.local/orderers/orderer.orderer.cacao.local/tls:/var/hyperledger/orderer/tls
      - orderer.cacao.local:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
      - "9443:9443"
    networks:
      - cacao-fabric

  peer0.cooperativa.cacao.local:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.cooperativa.cacao.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.cooperativa.cacao.local
      - CORE_PEER_ADDRESS=peer0.cooperativa.cacao.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.cooperativa.cacao.local:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.cooperativa.cacao.local:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.cooperativa.cacao.local:7051
      - CORE_PEER_LOCALMSPID=CooperativaMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=cacao-fabric
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/cooperativa.cacao.local/peers/peer0.cooperativa.cacao.local/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/cooperativa.cacao.local/peers/peer0.cooperativa.cacao.local/tls:/etc/hyperledger/fabric/tls
      - peer0.cooperativa.cacao.local:/var/hyperledger/production
    ports:
      - "7051:7051"
      - "9444:9444"
    networks:
      - cacao-fabric

  peer0.certificadora.cacao.local:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.certificadora.cacao.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.certificadora.cacao.local
      - CORE_PEER_ADDRESS=peer0.certificadora.cacao.local:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.certificadora.cacao.local:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.certificadora.cacao.local:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.certificadora.cacao.local:9051
      - CORE_PEER_LOCALMSPID=CertificadoraMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=cacao-fabric
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/certificadora.cacao.local/peers/peer0.certificadora.cacao.local/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/certificadora.cacao.local/peers/peer0.certificadora.cacao.local/tls:/etc/hyperledger/fabric/tls
      - peer0.certificadora.cacao.local:/var/hyperledger/production
    ports:
      - "9051:9051"
      - "9445:9445"
    networks:
      - cacao-fabric

  peer0.exportador.cacao.local:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.exportador.cacao.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.exportador.cacao.local
      - CORE_PEER_ADDRESS=peer0.exportador.cacao.local:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.exportador.cacao.local:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.exportador.cacao.local:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.exportador.cacao.local:11051
      - CORE_PEER_LOCALMSPID=ExportadorMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=cacao-fabric
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9446
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/exportador.cacao.local/peers/peer0.exportador.cacao.local/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/exportador.cacao.local/peers/peer0.exportador.cacao.local/tls:/etc/hyperledger/fabric/tls
      - peer0.exportador.cacao.local:/var/hyperledger/production
    ports:
      - "11051:11051"
      - "9446:9446"
    networks:
      - cacao-fabric
