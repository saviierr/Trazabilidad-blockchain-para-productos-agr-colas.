# WP-20 · Red Hyperledger Fabric — Fabric CA por organización.
# Una CA emite tanto identidades de aplicación (perfil por defecto) como
# certificados TLS (perfil `tls`) — evita levantar una segunda CA de TLS por
# organización (ver docs/WP-20-plan-red-hyperledger-fabric.md §2.3).
name: cacao-fabric-ca

networks:
  cacao-fabric:
    external: true

services:
  ca-cooperativa:
    image: hyperledger/fabric-ca:1.5
    container_name: ca-cooperativa.cacao.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-cooperativa
      - FABRIC_CA_SERVER_CSR_HOSTS=ca-cooperativa.cacao.local,localhost
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    ports:
      - "7054:7054"
      - "17054:17054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/cooperativa:/etc/hyperledger/fabric-ca-server
    networks:
      - cacao-fabric

  ca-certificadora:
    image: hyperledger/fabric-ca:1.5
    container_name: ca-certificadora.cacao.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-certificadora
      - FABRIC_CA_SERVER_CSR_HOSTS=ca-certificadora.cacao.local,localhost
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:18054
    ports:
      - "8054:8054"
      - "18054:18054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/certificadora:/etc/hyperledger/fabric-ca-server
    networks:
      - cacao-fabric

  ca-exportador:
    image: hyperledger/fabric-ca:1.5
    container_name: ca-exportador.cacao.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-exportador
      - FABRIC_CA_SERVER_CSR_HOSTS=ca-exportador.cacao.local,localhost
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:19054
    ports:
      - "9054:9054"
      - "19054:19054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/exportador:/etc/hyperledger/fabric-ca-server
    networks:
      - cacao-fabric

  ca-transportista:
    image: hyperledger/fabric-ca:1.5
    container_name: ca-transportista.cacao.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-transportista
      - FABRIC_CA_SERVER_CSR_HOSTS=ca-transportista.cacao.local,localhost
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=10054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:20054
    ports:
      - "10054:10054"
      - "20054:20054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/transportista:/etc/hyperledger/fabric-ca-server
    networks:
      - cacao-fabric

  ca-orderer:
    image: hyperledger/fabric-ca:1.5
    container_name: ca-orderer.cacao.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_CSR_HOSTS=ca-orderer.cacao.local,localhost
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=11054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:21054
    ports:
      - "11054:11054"
      - "21054:21054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/orderer:/etc/hyperledger/fabric-ca-server
    networks:
      - cacao-fabric
